server:
  port: 8080

spring:
  application:
    name: community-fresh-market
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cfm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:cfm}
    password: ${DB_PASSWORD:cfm_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  default-store-id: ${DEFAULT_STORE_ID:1}
  jwt-secret: ${JWT_SECRET:dev-only-change-me-please-32bytes!!}
  jwt-expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  wx-appid: ${WX_APPID:}
  wx-secret: ${WX_SECRET:}
  bootstrap-owner-openid: ${BOOTSTRAP_OWNER_OPENID:}
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://127.0.0.1:8088/uploads}
  # 订阅消息模板（见 deploy/.env.example 注释）；空=只日志不发送
  subscribe-restock-template-id: ${WX_SUBSCRIBE_RESTOCK_TEMPLATE_ID:}       # 到货提醒 → 顾客
  subscribe-new-order-template-id: ${WX_SUBSCRIBE_NEW_ORDER_TEMPLATE_ID:}   # 新预约 → 店员
  subscribe-cancel-template-id: ${WX_SUBSCRIBE_CANCEL_TEMPLATE_ID:}         # 取消 → 对端
  subscribe-arrived-template-id: ${WX_SUBSCRIBE_ARRIVED_TEMPLATE_ID:}       # 到店 → 店员
  # 邀请普通链接前缀（?code=邀请码）；公众平台配置扫该链接打开小程序
  invite-link-base: ${INVITE_LINK_BASE:}

logging:
  level:
    root: INFO
    com.communityfreshmarket: DEBUG
