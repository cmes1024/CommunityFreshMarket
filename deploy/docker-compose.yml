# Docker 默认的 json-file 日志没有上限，跑久了能把磁盘吃满。
# 每个容器保留最近 3 个 10MB 文件，单项目日志上限约 30MB。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # IMAGE_PREFIX 留空时直接用官方镜像；服务器没配 registry-mirrors 时，
    # 可在 .env 里写 docker.m.daocloud.io/library/ 之类的国内前缀。
    image: ${IMAGE_PREFIX:-}postgres:16-alpine
    container_name: cfm-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: cfm
      POSTGRES_USER: cfm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cfm_dev_password}
    volumes:
      - cfm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfm -d cfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${IMAGE_PREFIX:-}redis:7-alpine
    container_name: cfm-redis
    restart: unless-stopped
    logging: *default-logging
    # 6379 已被宿主机占用，不映射端口。只在 Compose 网络里给 cfm-api 用。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cfm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}alpine:3.20
        # 默认走 MinIO 官方 CDN；国内拉不动时改成镜像站或自建反代。
        MINIO_DOWNLOAD_BASE: ${MINIO_DOWNLOAD_BASE:-https://dl.min.io/server/minio/release/linux-amd64/archive}
    image: cfm-minio:local
    container_name: cfm-minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cfm}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cfm_dev_password}
    ports:
      # 宿主机 9000 已被占用。只绑回环。图片路径就是桶名 communityfreshmarket。
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
    volumes:
      - cfm_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        # 没单独指定时跟随 IMAGE_PREFIX，省得只加速了一半。
        MAVEN_IMAGE: ${MAVEN_IMAGE:-${IMAGE_PREFIX:-}maven:3.9.9-eclipse-temurin-17}
        JRE_IMAGE: ${JRE_IMAGE:-${IMAGE_PREFIX:-}eclipse-temurin:17-jre-alpine}
    # 显式命名，和 hs-api / shop-api / cfm-minio:local 保持同一风格；
    # 不写的话 compose 会按目录名生成 deploy-api。
    image: cfm-api:local
    container_name: cfm-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      DB_URL: jdbc:postgresql://postgres:5432/cfm
      DB_USER: cfm
      DB_PASSWORD: ${DB_PASSWORD:-cfm_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      DEFAULT_STORE_ID: ${DEFAULT_STORE_ID:-1}
      BOOTSTRAP_OWNER_OPENID: ${BOOTSTRAP_OWNER_OPENID:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cfm}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cfm_dev_password}
      MINIO_BUCKET: communityfreshmarket
      UPLOAD_PUBLIC_BASE: ${UPLOAD_PUBLIC_BASE:-http://127.0.0.1:9002/communityfreshmarket}
      WX_SUBSCRIBE_RESTOCK_TEMPLATE_ID: ${WX_SUBSCRIBE_RESTOCK_TEMPLATE_ID:-}
      WX_SUBSCRIBE_NEW_ORDER_TEMPLATE_ID: ${WX_SUBSCRIBE_NEW_ORDER_TEMPLATE_ID:-}
      WX_SUBSCRIBE_CANCEL_TEMPLATE_ID: ${WX_SUBSCRIBE_CANCEL_TEMPLATE_ID:-}
      WX_SUBSCRIBE_DELIVERING_TEMPLATE_ID: ${WX_SUBSCRIBE_DELIVERING_TEMPLATE_ID:-}
      INVITE_LINK_BASE: ${INVITE_LINK_BASE:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8088"

volumes:
  cfm_pg_data:
  cfm_redis_data:
  cfm_minio_data:
